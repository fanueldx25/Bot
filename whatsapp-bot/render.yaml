services:
  - type: web
    name: whatsapp-bot
    runtime: node
    plan: starter  # 'free' for testing, 'starter' for persistent disk + no sleep
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/state  # Or add a dedicated /health route
    envVars:
      - key: SESSION_DIR
        value: /opt/render/project/src/sessions  # Match your disk mount path
    disk:
      name: whatsapp-sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1