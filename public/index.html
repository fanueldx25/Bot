<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ollama Cloud Tester</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b;
    --border: #2a2f3a; --text: #e6e9ef; --muted: #8b93a7;
    --accent: #6c8cff; --accent-hover: #5a7aff;
    --user: #2a3550; --assistant: #1e222b; --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
  header .dot.on { background: #4ade80; }
  header .dot.err { background: var(--error); }
  header button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  header button:hover { color: var(--text); border-color: var(--muted); }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg {
    max-width: 780px; width: fit-content; padding: 12px 16px;
    border-radius: 12px; line-height: 1.55; white-space: pre-wrap;
    word-wrap: break-word; font-size: 14.5px;
  }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.assistant { background: var(--assistant); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.error { background: rgba(255,107,107,0.1); border: 1px solid var(--error); color: var(--error); align-self: center; font-size: 13px; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: middle; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--border); padding: 16px; background: var(--panel); flex-shrink: 0; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 14px;
    font-family: inherit; font-size: 14.5px; resize: none;
    max-height: 200px; min-height: 46px; outline: none; line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent); color: white; border: none; width: 46px; height: 46px;
    border-radius: 10px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .settings { max-width: 820px; margin: 0 auto 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .settings input, .settings select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
    font-family: inherit; outline: none;
  }
  .settings input:focus, .settings select:focus { border-color: var(--accent); }
  .settings .key { flex: 1; min-width: 260px; }
  .settings .model { min-width: 180px; }
  .settings label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 4px; }
  .settings .field { display: flex; flex-direction: column; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }
  .empty h2 { color: var(--text); font-size: 20px; margin-bottom: 6px; }
</style>
</head>
<body>

<header>
  <span class="dot" id="status"></span>
  <h1>Ollama Cloud Tester</h1>
  <button id="clear">Clear</button>
</header>

<div id="chat">
  <div class="empty" id="empty">
    <h2>Start a conversation</h2>
    <div>Enter your Ollama Cloud API key and pick a model below.</div>
    <div>Your key is sent to your own proxy, never stored on the server.</div>
  </div>
</div>

<footer>
  <div class="settings">
    <div class="field" style="flex:1">
      <label for="apikey">API Key</label>
      <input id="apikey" type="password" class="key" placeholder="ollama_..." autocomplete="off" />
    </div>
    <div class="field">
      <label for="model">Model</label>
      <input id="model" class="model" list="models" value="gpt-oss:120b" autocomplete="off" />
      <datalist id="models">
        <option value="gpt-oss:120b"></option>
        <option value="gpt-oss:20b"></option>
        <option value="qwen3:480b"></option>
        <option value="deepseek-v3.1:671b"></option>
        <option value="kimi-k2:1t"></option>
        <option value="glm-4.6"></option>
        <option value="gemma3:27b"></option>
      </datalist>
    </div>
    <div class="field">
      <label for="temp">Temperature</label>
      <input id="temp" class="model" type="number" min="0" max="2" step="0.1" value="0.7" />
    </div>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Send a message... (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="send-btn" id="send" title="Send">➤</button>
  </div>
  <div class="hint">Streaming via your proxy • Session kept in memory</div>
</footer>

<script>
const chatEl   = document.getElementById("chat");
const emptyEl  = document.getElementById("empty");
const inputEl  = document.getElementById("input");
const sendEl   = document.getElementById("send");
const keyEl    = document.getElementById("apikey");
const modelEl  = document.getElementById("model");
const tempEl   = document.getElementById("temp");
const statusEl = document.getElementById("status");
const clearEl  = document.getElementById("clear");

keyEl.value   = localStorage.getItem("ollama_key")   || "";
modelEl.value = localStorage.getItem("ollama_model") || "gpt-oss:120b";
keyEl.addEventListener("input",  () => localStorage.setItem("ollama_key", keyEl.value));
modelEl.addEventListener("input",() => localStorage.setItem("ollama_model", modelEl.value));

const messages = [];
let busy = false;

function setStatus(state) {
  statusEl.classList.remove("on", "err");
  if (state === "ok")  statusEl.classList.add("on");
  if (state === "err") statusEl.classList.add("err");
}
function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addMessage(role, text = "") {
  emptyEl?.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role !== "error") {
    const r = document.createElement("div");
    r.className = "role";
    r.textContent = role === "user" ? "You" : "Assistant";
    el.appendChild(r);
  }
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = text;
  el.appendChild(body);
  chatEl.appendChild(el);
  scrollBottom();
  return body;
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  const key = keyEl.value.trim();
  if (!key) {
    addMessage("error", "Please enter your Ollama Cloud API key.");
    setStatus("err");
    return;
  }

  inputEl.value = "";
  autoGrow();
  busy = true;
  sendEl.disabled = true;

  addMessage("user", text);
  messages.push({ role: "user", content: text });

  const bodyEl = addMessage("assistant", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  bodyEl.appendChild(cursor);

  let assistantText = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Ollama-Key": key,
      },
      body: JSON.stringify({
        model: modelEl.value.trim(),
        messages,
        options: { temperature: parseFloat(tempEl.value) || 0.7 },
      }),
    });

    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.error || `HTTP ${res.status}`);
    }

    setStatus("ok");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const chunk = JSON.parse(line);
          if (chunk.message?.content) {
            assistantText += chunk.message.content;
            bodyEl.textContent = assistantText;
            bodyEl.appendChild(cursor);
            scrollBottom();
          }
          if (chunk.error) throw new Error(chunk.error);
        } catch (e) { /* ignore non-JSON lines */ }
      }
    }

    cursor.remove();
    if (assistantText) messages.push({ role: "assistant", content: assistantText });
    else bodyEl.textContent = "(empty response)";
  } catch (err) {
    cursor.remove();
    bodyEl.parentElement?.remove();
    addMessage("error", err.message || String(err));
    setStatus("err");
  } finally {
    busy = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener("click", send);
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
clearEl.addEventListener("click", () => {
  messages.length = 0;
  chatEl.innerHTML = "";
  chatEl.appendChild(emptyEl);
  setStatus(null);
});

inputEl.focus();
</script>
</body>
</html>
