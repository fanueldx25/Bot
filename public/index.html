<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp AI Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #0a0e1a; color: #e5e9f0; min-height: 100vh; padding: 20px; }
    .app { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; }
    .card { background: #0f131f; border-radius: 24px; padding: 24px; border: 1px solid #252e42; margin-bottom: 20px; }
    .card h2 { font-size: 1rem; color: #8b9bb5; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-badge { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #1a212f; border-radius: 100px; }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #f44; box-shadow: 0 0 12px #f44; }
    .indicator.connected { background: #4ade80; box-shadow: 0 0 12px #4ade80; }
    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1f2637; font-size: 0.9rem; }
    .info-label { color: #8b9bb5; }
    .phone-input { width: 100%; background: #1a212f; border: 1px solid #2e3a52; border-radius: 16px; padding: 14px 18px; color: #e5e9f0; font-size: 1rem; outline: none; margin-bottom: 12px; }
    .btn { background: #1e293b; border: 1px solid #2e3a52; border-radius: 16px; padding: 14px 20px; color: #e5e9f0; cursor: pointer; font-size: 0.95rem; width: 100%; margin-bottom: 10px; }
    .btn.primary { background: #3b82f6; border-color: #3b82f6; }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pairing-code { background: #000; border-radius: 16px; padding: 18px; text-align: center; font-size: 1.8rem; font-weight: 700; letter-spacing: 4px; color: #4ade80; font-family: monospace; border: 1px dashed #2e3a52; margin-top: 10px; }
    .chat-window { background: #0b0f17; border-radius: 24px; padding: 20px; min-height: 300px; max-height: 400px; overflow-y: auto; border: 1px solid #1f2637; margin-bottom: 16px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 10px; word-break: break-word; }
    .message.user { background: #1e2a3d; border: 1px solid #2f3e58; }
    .message.assistant { background: #1a2e2a; border: 1px solid #2d4a40; color: #d1fae5; margin-left: auto; }
    .meta { font-size: 0.7rem; color: #8b9bb5; margin-bottom: 4px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; border-left: 4px solid #3b82f6; padding: 14px 22px; border-radius: 14px; z-index: 999; }
    .toast.error { border-left-color: #ef4444; }
    .toast.success { border-left-color: #4ade80; }
    @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div>
      <div class="card">
        <h2>🔌 Connection</h2>
        <div class="status-badge">
          <span class="indicator" id="statusIndicator"></span>
          <span id="statusText">Disconnected</span>
        </div>
        <div class="info-row" style="margin-top:14px;">
          <span class="info-label">Bot</span><span id="botName">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Model</span><span id="modelName">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Host</span><span id="hostName">—</span>
        </div>
        <div style="margin-top:16px;">
          <input type="tel" id="phoneInput" class="phone-input" placeholder="Phone (e.g. 15551234567)" />
          <button class="btn primary" id="pairBtn">📱 Request pairing code</button>
          <div id="pairingCodeDisplay" class="pairing-code" style="display:none;"></div>
          <button class="btn" id="reconnectBtn">🔄 Reconnect</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>💬 Conversation</h2>
        <select id="chatSelector" class="phone-input" style="margin-bottom:10px;">
          <option value="">— select chat —</option>
        </select>
        <div class="chat-window" id="chatWindow">
          <div style="color:#4a5a72; text-align:center; margin-top:60px;">No messages yet.</div>
        </div>
        <button class="btn" id="refreshChatsBtn">🔄 Refresh</button>
        <button class="btn" id="clearHistoryBtn">🗑️ Clear history</button>
      </div>

      <div class="card">
        <h2>📤 Test message</h2>
        <input type="text" id="testTo" class="phone-input" placeholder="Recipient (15551234567 or ...@s.whatsapp.net)" />
        <input type="text" id="testText" class="phone-input" placeholder="Message..." />
        <button class="btn primary" id="sendTestBtn">✈️ Send</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    const state = { currentChat: null, typing: false, history: {}, chats: [] };

    function toast(msg, type = 'info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function refreshStatus() {
      try {
        const d = await api('/health');
        const ind = document.getElementById('statusIndicator');
        const txt = document.getElementById('statusText');
        if (d.connected) {
          ind.classList.add('connected');
          txt.textContent = 'Connected';
          document.getElementById('botName').textContent = d.user || '—';
        } else {
          ind.classList.remove('connected');
          txt.textContent = 'Disconnected';
        }
        document.getElementById('modelName').textContent = d.model || '—';
        document.getElementById('hostName').textContent = d.host || '—';

        if (d.pairing?.code) {
          const el = document.getElementById('pairingCodeDisplay');
          el.style.display = 'block';
          el.textContent = d.pairing.code;
        }
      } catch (e) {
        console.warn('status failed:', e.message);
      }
    }

    async function refreshChats() {
      try {
        const d = await api('/chats');
        state.chats = d.chats || [];
        const sel = document.getElementById('chatSelector');
        sel.innerHTML = '<option value="">— select chat —</option>';
        state.chats.forEach((id) => {
          const o = document.createElement('option');
          o.value = id;
          o.textContent = id.length > 35 ? id.slice(0, 33) + '…' : id;
          sel.appendChild(o);
        });
      } catch (e) {
        console.warn('chats failed:', e.message);
      }
    }

    function renderChat() {
      const win = document.getElementById('chatWindow');
      const h = state.history[state.currentChat] || [];
      if (!h.length && !state.typing) {
        win.innerHTML = '<div style="color:#4a5a72; text-align:center; margin-top:60px;">No messages.</div>';
        return;
      }
      let html = '';
      h.forEach((m) => {
        const role = m.role === 'user' ? 'user' : 'assistant';
        html += `<div class="message ${role}"><div class="meta">${role === 'user' ? 'User' : 'AI'}</div>${escapeHtml(m.content)}</div>`;
      });
      if (state.typing) {
        html += `<div class="message assistant">...</div>`;
      }
      win.innerHTML = html;
      win.scrollTop = win.scrollHeight;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    async function loadHistory(chatId) {
      if (!chatId) return;
      const d = await api(`/history/${encodeURIComponent(chatId)}`);
      state.history[chatId] = d.history || [];
      renderChat();
    }

    document.getElementById('pairBtn').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
      if (!phone) return toast('Enter a phone number', 'error');
      try {
        const d = await api('/pair', { method: 'POST', body: JSON.stringify({ phone }) });
        const el = document.getElementById('pairingCodeDisplay');
        el.style.display = 'block';
        el.textContent = d.code;
        toast('Pairing code received!', 'success');
      } catch (e) {
        toast('Pairing failed: ' + e.message, 'error');
      }
    };

    document.getElementById('reconnectBtn').onclick = async () => {
      try {
        await api('/reconnect', { method: 'POST' });
        toast('Reconnecting…');
      } catch (e) { toast(e.message, 'error'); }
    };

    document.getElementById('refreshChatsBtn').onclick = refreshChats;

    document.getElementById('chatSelector').onchange = (e) => {
      state.currentChat = e.target.value || null;
      if (state.currentChat) loadHistory(state.currentChat);
      else renderChat();
    };

    document.getElementById('clearHistoryBtn').onclick = async () => {
      if (!state.currentChat) return toast('No chat selected', 'error');
      await api(`/history/${encodeURIComponent(state.currentChat)}`, { method: 'DELETE' });
      state.history[state.currentChat] = [];
      renderChat();
      toast('Cleared', 'success');
    };

    document.getElementById('sendTestBtn').onclick = async () => {
      const to = document.getElementById('testTo').value.trim();
      const text = document.getElementById('testText').value.trim();
      if (!to || !text) return toast('Recipient + text required', 'error');
      try {
        await api('/send', { method: 'POST', body: JSON.stringify({ to, text }) });
        toast('Sent!', 'success');
        document.getElementById('testText').value = '';
        if (state.currentChat === to) await loadHistory(to);
      } catch (e) { toast('Failed: ' + e.message, 'error'); }
    };

    refreshStatus();
    refreshChats();
    setInterval(refreshStatus, 8000);
  </script>
</body>
</html>
