<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nexus Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0f0f10',
            panel: '#17171a',
            panel2: '#1f1f23',
            border: '#2a2a30',
            accent: '#6366f1',
            accent2: '#818cf8',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="bg-bg text-white font-sans antialiased overflow-hidden">
  
  <div id="app" class="flex flex-col h-[100dvh] max-w-2xl mx-auto border-x border-border">
    
    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 border-b border-border bg-panel/80 backdrop-blur-lg sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-purple-600 flex items-center justify-center text-sm font-bold shadow-lg shadow-accent/20">
          N
        </div>
        <div>
          <h1 class="text-[15px] font-semibold leading-tight">Nexus Chat</h1>
          <button id="modelBtn" class="text-[11px] text-gray-400 hover:text-accent2 transition flex items-center gap-1">
            <span id="currentModel">Gemma 4 31B</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>
      </div>
      <button id="clearBtn" class="p-2 rounded-lg hover:bg-panel2 transition text-gray-400 hover:text-white" title="New chat">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </header>
    
    <!-- Messages -->
    <main id="messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 scroll-smooth">
      <!-- Welcome -->
      <div id="welcome" class="flex flex-col items-center justify-center h-full text-center px-4">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-accent to-purple-600 flex items-center justify-center text-2xl font-bold mb-4 shadow-xl shadow-accent/20">
          N
        </div>
        <h2 class="text-xl font-semibold mb-1">How can I help?</h2>
        <p class="text-sm text-gray-500 mb-6">Ask anything. Switch models anytime.</p>
        <div class="grid grid-cols-1 gap-2 w-full max-w-sm">
          <button class="suggestion text-left text-sm px-4 py-3 rounded-xl bg-panel border border-border hover:border-accent/50 transition">
            💡 Explain quantum computing simply
          </button>
          <button class="suggestion text-left text-sm px-4 py-3 rounded-xl bg-panel border border-border hover:border-accent/50 transition">
            ✍️ Write a haiku about the ocean
          </button>
          <button class="suggestion text-left text-sm px-4 py-3 rounded-xl bg-panel border border-border hover:border-accent/50 transition">
            🧮 Solve: 2x + 5 = 17
          </button>
        </div>
      </div>
    </main>
    
    <!-- Input -->
    <footer class="border-t border-border bg-panel/80 backdrop-blur-lg px-3 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
      <form id="chatForm" class="flex items-end gap-2">
        <div class="flex-1 bg-panel2 rounded-2xl border border-border focus-within:border-accent/60 transition">
          <textarea id="input" rows="1" placeholder="Message..." class="w-full bg-transparent text-[15px] px-4 py-3 resize-none outline-none placeholder-gray-500 max-h-32"></textarea>
        </div>
        <button id="sendBtn" type="submit" class="w-11 h-11 rounded-2xl bg-accent hover:bg-accent2 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition shadow-lg shadow-accent/20 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>
      <p class="text-[10px] text-center text-gray-600 mt-2">AI can make mistakes. Verify important info.</p>
    </footer>
  </div>
  
  <!-- Model Picker Sheet -->
  <div id="modelSheet" class="fixed inset-0 z-50 hidden">
    <div id="sheetBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity"></div>
    <div id="sheetPanel" class="absolute bottom-0 left-0 right-0 bg-panel border-t border-border rounded-t-3xl max-h-[80vh] overflow-y-auto translate-y-full transition-transform">
      <div class="sticky top-0 bg-panel px-5 pt-3 pb-4 border-b border-border">
        <div class="w-10 h-1 bg-gray-600 rounded-full mx-auto mb-4"></div>
        <h3 class="text-base font-semibold">Choose model</h3>
        <p class="text-xs text-gray-500 mt-0.5">Free usage applies to all listed models</p>
      </div>
      <div id="modelList" class="p-3 space-y-1.5 pb-[max(1rem,env(safe-area-inset-bottom))]"></div>
    </div>
  </div>
  
  <script src="/app.js"></script>
</body>

</html>
