services:
  - type: web
    name: ollama-bot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-oss:20b
      - key: PYTHON_VERSION
        value: 3.11.9