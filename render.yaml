services:
  - type: web
    name: wa-bot
    runtime: node
    plan: starter           # ⚠️ free tier sleeps — see notes below
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        sync: false          # you fill in dashboard
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NUMBERS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: wa-bot-db
          property: connectionString

databases:
  - name: wa-bot-db
    plan: free              # 90 days free, then paid
    databaseName: wabot
    user: wabot