services:
  - type: web
    name: wa-bot
    runtime: node
    plan: starter                # 'free' works but sleeps — bot disconnects
    region: frankfurt            # or oregon / singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production

      # ---- Dashboard ----
      - key: DASHBOARD_PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true      # Render generates a secure random string
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS_HASH
        sync: false              # you paste the bcrypt hash in the dashboard UI

      # ---- Bot ----
      - key: BOT_NAME
        value: Command Center
      - key: PREFIX
        value: ".,!"
      - key: OWNER_NUMBER
        value: "237651858408"

      # ---- Persistent disk for WhatsApp session ----
      - key: AUTH_DIR
        value: /var/data/creds

    disk:
      name: wa-session
      mountPath: /var/data
      sizeGB: 1